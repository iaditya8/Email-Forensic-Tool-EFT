[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "eft"
version = "0.1.0"
description = "Enterprise-Grade Digital Forensics & Incident Response (DFIR) Email Analysis Engine"
readme = "README.md"
requires-python = ">=3.9,<4.0"
license = "MIT"
authors = [
    { name = "Aditya" }
]
dependencies = [
    "pydantic>=2.5.0",
    "extract-msg>=0.48.0",
    "dnspython>=2.6.0",
    "authres>=1.2.0",
    "tldextract>=5.1.0",
    "puremagic>=1.20",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "reportlab>=4.1.0",
    "stix2>=3.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
]

[tool.poetry]
packages = [{include = "eft", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=4.1.0"
ruff = ">=0.3.0"
mypy = ">=1.8.0"
types-requests = ">=2.31.0"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
